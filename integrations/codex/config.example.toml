# Codex CLI: код и память Сёмы одним сервером MCP — житель машины.
# Добавьте в ~/.codex/config.toml. Путь к бинарнику — ваш.
#
# Отдельного сервера памяти больше нет: и карточки кода, и память
# приходят от жителя машины, а он говорит с Сёмой своим шифрованным
# проводом. Ни токена, ни адреса в настройках.
[mcp_servers.sema_agent]
command = "/path/to/semaagent"  # путь к бинарнику: go env GOPATH, затем /bin/semaagent
