# Сканер секретов: правила по умолчанию. Тесты маскировки секретов нарочно
# держат выдуманные ключи и токены (sk-…1234567890, ghp_0123…), поэтому
# тестовые файлы и testdata из проверки исключены.
[extend]
useDefault = true

[allowlist]
description = "выдуманные значения в тестах маскировки"
paths = [
  '''_test\.go$''',
  '''(^|/)testdata/''',
]
